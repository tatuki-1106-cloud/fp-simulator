# 所得税パラメータ(出典: 国税庁等)
# 各エントリは適用開始日(from)と出典URLを必須とする

- path: 所得税.基礎控除.控除額
  description: 所得税の基礎控除額(合計所得金額2,400万円以下の場合)
  values:
    - from: 2013-01-01
      value: 380000
      source: https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1199.htm
    - from: 2020-01-01
      value: 480000
      source: https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1199.htm
    - from: 2025-01-01
      value: 580000  # 令和7年度税制改正(最大)
      source: https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1199.htm

- path: 所得税.給与所得控除.最低保障額
  description: 給与所得控除の最低保障額(給与収入162.5万円以下)
  values:
    - from: 2013-01-01
      value: 650000
      source: https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1410.htm
    - from: 2020-01-01
      value: 550000
      source: https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1410.htm
    - from: 2025-01-01
      value: 650000  # 令和7年度税制改正で引き上げ
      source: https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1410.htm

# 給与所得控除の速算表(収入金額の上限/控除額 or 率)
- path: 所得税.給与所得控除.速算表
  description: 給与所得控除の速算表。上限を超えた部分に率を適用し、加算額を足す
  values:
    - from: 2020-01-01
      value:
        brackets:
          - up_to: 1625000
            type: fixed
            amount: 550000
          - up_to: 1800000
            type: rate_plus
            rate: 0.4
            subtract: 100000
          - up_to: 3600000
            type: rate_plus
            rate: 0.3
            subtract: -80000
          - up_to: 6600000
            type: rate_plus
            rate: 0.2
            subtract: -440000
          - up_to: 8500000
            type: rate_plus
            rate: 0.1
            subtract: -1100000
          - up_to: null
            type: fixed
            amount: 1950000
      source: https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1410.htm
    # 令和7年度税制改正: 最低保障額が55万→65万に引き上げ
    - from: 2025-01-01
      value:
        brackets:
          - up_to: 1900000
            type: fixed
            amount: 650000
          - up_to: 3600000
            type: rate_plus
            rate: 0.3
            subtract: -80000
          - up_to: 6600000
            type: rate_plus
            rate: 0.2
            subtract: -440000
          - up_to: 8500000
            type: rate_plus
            rate: 0.1
            subtract: -1100000
          - up_to: null
            type: fixed
            amount: 1950000
      source: https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1410.htm

