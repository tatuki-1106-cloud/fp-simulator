- path: 税制.小規模企業共済等掛金控除
  description: "iDeCo掛金は全額所得控除(小規模企業共済等掛金控除)"
  values:
    - from: 2013-01-01
      value: "full"
      source: https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1135.htm
