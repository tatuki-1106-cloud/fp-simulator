  values:
    - from: 2024-01-01
      value: 3600000
      source: https://www.fsa.go.jp/policy/nisa2/index.html

- path: NISA.非課税保有限度額
  description: 新NISAの非課税保有限度額(生涯)
  values:
    - from: 2024-01-01
      value: 18000000
      source: https://www.fsa.go.jp/policy/nisa2/index.html

- path: NISA.つみたて枠.年間上限
  description: 新NISAのつみたて投資枠(年間)
  values:
    - from: 2024-01-01
      value: 1200000
