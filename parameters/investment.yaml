# iDeCo・NISA・確定拠出年金パラメータ
# 出典: 国税庁・金融庁・厚生労働省

- path: iDeCo.掛金上限.第1号
  description: "iDeCo掛金上限(第1号被保険者: 自営業等)"
  values:
    - from: 2017-01-01
      value: 68000
      source: https://www.ideco-koushiki.jp/guide/column/starting-ideco-01.html

- path: iDeCo.掛金上限.第2号
  description: "iDeCo掛金上限(第2号被保険者: 会社員・公務員、企業年金なし)"
  values:
    - from: 2017-01-01
      value: 23000
      source: https://www.ideco-koushiki.jp/guide/column/starting-ideco-01.html

- path: iDeCo.掛金上限.第3号
  description: "iDeCo掛金上限(第3号被保険者: 専業主婦等)"
  values:
    - from: 2017-01-01
      value: 23000
      source: https://www.ideco-koushiki.jp/guide/column/starting-ideco-01.html

- path: iDeCo.受取開始年齢.最小
  description: "iDeCoの受取開始可能年齢(最小)"
  values:
    - from: 2022-04-01
      value: 60
      source: https://www.ideco-koushiki.jp/guide/column/starting-ideco-01.html

- path: iDeCo.受取開始年齢.最大
  description: "iDeCoの受取開始可能年齢(最大)"
  values:
    - from: 2022-04-01
      value: 75
      source: https://www.ideco-koushiki.jp/guide/column/starting-ideco-01.html

- path: NISA.年間投資上限
